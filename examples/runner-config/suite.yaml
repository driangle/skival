# Runner and runner_config at defaults, eval, and variant levels.
# Shows override precedence: variant > eval > defaults.
#
# claude-code is deny-by-default: `allowed_tools` is an EXCLUSIVE whitelist of
# built-in tools. Any built-in not listed (and any added by future CLI releases)
# is denied for the run — you never maintain a deny list. Omitting `allowed_tools`
# entirely denies every built-in; use `allowed_tools: [default]` to opt back into
# the full built-in set. See docs/configuration.md ("Runner Configuration").
version: 1
description: "Demonstrates runner_config override precedence"

defaults:
  model: "claude-sonnet-4-6"
  samples: 2
  runner: claude-code
  runner_config:
    max_turns: 20
    allowed_tools:        # exclusive whitelist: only these built-ins are usable
      - Read
      - Write
      - Bash
      - Glob
      - Grep

evals:
  # Inherits all defaults as-is
  - id: inherits-defaults
    dir: "./workdir"
    prompt: "Write hello.py that prints 'hello'."
    verify:
      - type: agent_exits_ok
    variants:
      - name: baseline
      - name: fewer-tools
        runner_config:
          allowed_tools:
            - Read
            - Write
      - name: full-access      # opt back into the entire built-in set
        runner_config:
          allowed_tools: [default]

  # Eval-level overrides merge with defaults
  - id: eval-override
    dir: "./workdir"
    prompt: "Write a test suite for a calculator module."
    verify:
      - type: agent_exits_ok
    runner_config:
      max_turns: 30              # overrides default of 20
      permission_mode: "plan"    # adds new key, defaults keys preserved
    variants:
      - name: baseline
      - name: fewer-turns
        runner_config:
          max_turns: 15

  # Variant-level overrides merge with eval + defaults
  - id: variant-override
    dir: "./workdir"
    prompt: "Refactor the utils module into smaller files."
    verify:
      - type: agent_exits_ok
    runner_config:
      max_turns: 25
    variants:
      - name: baseline
      - name: restricted
        runner_config:
          max_turns: 10          # overrides eval's 25
          allowed_tools:         # overrides defaults
            - Read
            - Edit
